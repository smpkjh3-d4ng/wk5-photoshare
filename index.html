<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>사진 공유 서비스 프로토타입</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
  :root { color-scheme: light; --bg: #FFFFFF; --fg: #111111; --sub: #707070; --line: #E4E4E4; --soft: #F2F2F2; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg);
    font-family: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    word-break: keep-all; -webkit-text-size-adjust: 100%;
    padding: calc(40px + env(safe-area-inset-top, 0px)) 20px calc(32px + env(safe-area-inset-bottom, 0px));
  }
  main { max-width: 420px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  h1 { margin: 0 0 4px; font-size: 24px; line-height: 1.35; }
  p.lead { margin: 0 0 12px; font-size: 14px; color: var(--sub); line-height: 1.55; }
  a.card {
    display: flex; align-items: center; gap: 14px; padding: 18px; border-radius: 18px;
    border: 1px solid var(--line); color: inherit; text-decoration: none; -webkit-tap-highlight-color: transparent;
  }
  a.card:active { background: var(--soft); }
  a.card.main { background: var(--fg); border-color: var(--fg); color: #fff; }
  a.card .ic { width: 48px; height: 48px; border-radius: 14px; background: var(--soft); display: grid; place-items: center; flex: none; }
  a.card.main .ic { background: rgba(255,255,255,.16); }
  a.card svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  a.card .txt { flex: 1; min-width: 0; }
  a.card b { display: block; font-size: 17px; }
  a.card small { display: block; margin-top: 3px; font-size: 13px; opacity: .75; line-height: 1.45; }
  a.card .go { font-size: 20px; opacity: .6; }
  .ut-links { display: flex; flex-direction: column; gap: 14px; margin-top: 10px; }
  .ut-links h2 { margin: 0; font-size: 18px; line-height: 1.5; }
  .note { margin: 10px 4px 0; font-size: 12px; color: var(--sub); line-height: 1.6; }
</style>
</head>
<body>
<main>
  <h1>사진 공유 서비스<br>워킹 프로토타입</h1>
  <p class="lead">휴대폰으로 열면 실제 앱·웹처럼 조작할 수 있어요.</p>

  <a class="card main" href="phou/">
    <span class="ic"><svg viewBox="0 0 24 24"><rect x="6" y="2.5" width="12" height="19" rx="3"/><path d="M11 18.5h2"/></svg></span>
    <span class="txt"><b>앱</b><small>홈, 공유 폴더, 전체 사진, 메뉴</small></span>
    <span class="go">›</span>
  </a>
  <a class="card" href="web/">
    <span class="ic"><svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg></span>
    <span class="txt"><b>초대 링크 웹</b><small>앱 없이 링크로 여는 화면 (초대, 앨범 보기, 내 사진 추가)</small></span>
    <span class="go">›</span>
  </a>

  <section class="ut-links" aria-labelledby="ut-title">
    <h2 id="ut-title">1차 UT 후 수정된 시안</h2>
    <a class="card" href="ut-1/web/">
      <span class="txt"><b>1차 UT 후 수정된 웹 시안</b><small>수정한 웹 시안 열기</small></span>
      <span class="go">›</span>
    </a>
    <a class="card" href="ut-1/app/">
      <span class="txt"><b>1차 UT 후 수정된 앱 시안</b><small>수정된 앱 시안 열기</small></span>
      <span class="go">›</span>
    </a>
  </section>

  <p class="note">화면 상태(로딩·비어 있음·오류 등)를 바꾸려면 두 손가락으로 화면을 탭하세요. 앱은 공유 → 홈 화면에 추가로 열면 주소창 없이 떠요.</p>
</main>
</body>
</html>
