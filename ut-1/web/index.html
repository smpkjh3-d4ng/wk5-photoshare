openViewer=function(id){if(S.webSelecting){const item=appWebItems().find(item=>item.members.some(p=>p.id===id));if(item){if(S.webSelected.has(item.id))S.webSelected.delete(item.id);else S.webSelected.add(item.id);}render(true);return;}const list=Array.from(screenEl.querySelectorAll('[data-photo]'),e=>e.dataset.photo);viewer={list,i:Math.max(0,list.indexOf(id)),photoOnly:false};document.getElementById('phone').classList.add('viewing');renderViewer();};
renderViewer=function(){const el=document.getElementById('viewer');el.classList.add('photo-viewer');if(!viewer){el.hidden=true;el.classList.remove('photo-only');document.getElementById('phone').classList.remove('viewing');setThemeColor('#fff');return;}const id=viewer.list[viewer.i],photo=appWebPhoto(id);if(!photo){viewer=null;renderViewer();return;}const group=appWebViewerGroup(),rep=group&&appWebRepresentative(group),upload=webUploadedPhotos.get(id);el.hidden=false;el.classList.toggle('photo-only',!!viewer.photoOnly);setThemeColor('#0d0d0d');ensureGuard();el.innerHTML=`<div class="viewer-panel" id="photoViewerContent"><div class="detail-top"><button type="button" data-vclose aria-label="사진 확대 닫기">${I.close}</button><div class="detail-title"><h2>${album.name}</h2><p>${photo.uploaded?'방금 올림':days[Number(id.slice(1).split('-')[0])].head} · ${photo.uploaded?'내가 올림':album.host+'님이 올림'}</p></div><span class="detail-index">${viewer.i+1} / ${viewer.list.length}</span></div>${group?`<div class="detail-representative"><span>비슷한 사진 ${group.members.length}장 · ${id===rep.id?'대표 사진':'사진 '+(group.members.findIndex(p=>p.id===id)+1)}</span><button type="button" data-web-edit-rep>대표 사진 바꾸기</button></div>`:'<div class="detail-representative" aria-hidden="true" style="visibility:hidden"><span>대표 사진 안내</span></div>'}<div class="detail-stage" id="vStage" role="button" tabindex="0" aria-label="${viewer.photoOnly?'사진 도구 다시 표시':'사진만 보기'}">${upload?.url&&!upload.heic?`<img src="${upload.url}" alt="내가 올린 사진 확대">`:`<div class="detail-placeholder" role="img" aria-label="사진 ${photo.number} 확대"><svg viewBox="0 0 60 60" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><rect x="7" y="10" width="46" height="40" rx="5"/><circle cx="23" cy="23" r="5"/><path d="m11 44 15-15 9 9 7-7 10 13"/></svg></div>`}<button class="detail-prev" data-vnav="-1" aria-label="이전 사진" ${viewer.i===0?'disabled':''}>${appWebIcon('back')}</button><button class="detail-next" data-vnav="1" aria-label="다음 사진" ${viewer.i===viewer.list.length-1?'disabled':''}>${appWebIcon('back').replace('m14 6-6 6 6 6','m10 6 6 6-6 6')}</button><button class="detail-like" data-web-like aria-label="좋아요" aria-pressed="${S.likedIds.has(id)}">${appWebIcon('heart')}<span>좋아요</span></button></div>${group?`<section class="detail-group-preview" aria-label="함께 묶인 비슷한 사진"><h3>함께 묶인 사진 · ${group.members.length}장</h3><div class="detail-group-thumbs">${group.members.map(p=>`<button class="detail-group-thumb" data-web-preview="${p.id}" aria-label="사진 ${p.number} 크게 보기" aria-pressed="${p.id===id}"><img src="${appWebSource(p)}" alt="사진 ${p.number} 미리보기">${p.id===rep.id?'<span class="group-thumb-rep">대표</span>':''}<small>사진 ${p.number}</small></button>`).join('')}</div></section>`:''}<div class="detail-actions"><button data-vsave>${appWebIcon('down')}저장</button><button data-web-share>${appWebIcon('share')}공유</button><button data-web-photo-info>${appWebIcon('info')}정보</button><button data-web-delete-photo>${appWebIcon('trash')}삭제</button></div></div>`;};
function appWebTogglePhotoOnly(){if(!viewer)return;viewer.photoOnly=!viewer.photoOnly;renderViewer();document.querySelector('#vStage')?.focus({preventScroll:true});}
function appWebRepresentativesSheet(){const group=appWebViewerGroup();if(!group)return;openSheet(`<h3>대표 사진 바꾸기</h3><p>비슷한 사진 ${group.members.length}장 중 대표를 골라 주세요.</p><div class="web-representative-choices">${group.members.map(p=>`<button data-web-set-rep="${p.id}" aria-label="사진 ${p.number}을 대표로 설정"><img src="${appWebSource(p)}" alt="사진 ${p.number}"><span>사진 ${p.number}</span></button>`).join('')}</div><button class="btn btn-sub" data-close>닫기</button>`);}
let appWebIgnoreTapUntil=0;
document.addEventListener('pointerup',e=>{if(viewer&&vx!==null&&Math.abs(e.clientX-vx)>50)appWebIgnoreTapUntil=Date.now()+400;},true);
document.addEventListener('keydown',e=>{if(e.target.matches('#vStage')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();appWebTogglePhotoOnly();}});
document.addEventListener('click',e=>{if(e.target.closest('[data-tab],[data-web-browse],[data-web-person],[data-web-place],[data-web-category],[data-go="upload"]')){S.webSelecting=false;S.webSelected.clear();}},true);
document.addEventListener('click',e=>{const target=e.target.closest('button');if(e.target.closest('#vStage')&&!target&&Date.now()>appWebIgnoreTapUntil){appWebTogglePhotoOnly();return;}if(!target)return;if(target.hasAttribute('data-web-selection')){S.webSelecting=!S.webSelecting;S.webSelected.clear();render(true);}else if(target.hasAttribute('data-web-selectall')){const items=appWebItems();S.webSelected=items.every(p=>S.webSelected.has(p.id))?new Set():new Set(items.map(p=>p.id));render(true);}else if(target.hasAttribute('data-web-selected-download')){const items=appWebItems().filter(p=>S.webSelected.has(p.id)),n=items.reduce((sum,item)=>sum+item.members.length,0);if(n)saveSheet(n,'선택한 사진');}else if(target.hasAttribute('data-web-share')){openSheet(`<h3>사진 공유</h3><p>이 앨범의 초대 링크로 함께 볼 수 있어요.</p><button class="btn btn-main" data-web-copy-invite>초대 링크 복사</button><button class="btn btn-sub" data-close>닫기</button>`);}else if(target.hasAttribute('data-web-copy-invite')){const text=location.href.split('#')[0];if(navigator.clipboard)navigator.clipboard.writeText(text).then(()=>toast('시연용 초대 링크를 복사했어요')).catch(()=>toast('복사를 허용해 주세요'));else toast('이 환경에서는 자동 복사를 지원하지 않아요');}else if(target.hasAttribute('data-web-more')){openSheet(`<h3>앨범 정보</h3><p>${album.name}<br>${album.date}<br>사진 ${webPhotos().length}장</p><button class="btn btn-sub" data-close>닫기</button>`);}else if(target.hasAttribute('data-web-like')){const id=viewer.list[viewer.i];if(S.likedIds.has(id))S.likedIds.delete(id);else S.likedIds.add(id);render(true);renderViewer();}else if(target.hasAttribute('data-web-preview')){viewer.list[viewer.i]=target.dataset.webPreview;renderViewer();}else if(target.hasAttribute('data-web-edit-rep'))appWebRepresentativesSheet();else if(target.hasAttribute('data-web-set-rep')){const group=appWebViewerGroup();if(group){S.representatives[group.id]=target.dataset.webSetRep;viewer.list[viewer.i]=target.dataset.webSetRep;closeSheet();render(true);renderViewer();}}else if(target.hasAttribute('data-web-photo-info')){const p=appWebPhoto(viewer.list[viewer.i]);openSheet(`<h3>사진 정보</h3><p>${album.name}<br>사진 ${p.number}<br>${new Date(p.at).toLocaleString('ko-KR')}</p><button class="btn btn-sub" data-close>닫기</button>`);}else if(target.hasAttribute('data-web-delete-photo')){openSheet('<h3>사진을 삭제할까요?</h3><p>이 시안의 앨범에서 사진을 숨겨요. 휴대폰 원본은 삭제되지 않아요.</p><div class="row2"><button class="btn-sub" data-close>취소</button><button class="btn-main" data-web-confirm-delete>삭제하기</button></div>');}else if(target.hasAttribute('data-web-confirm-delete')){S.deletedIds.add(viewer.list[viewer.i]);closeSheet();viewer=null;renderViewer();render(true);}});

webTimePanel=function(){
 const counts=Array(24).fill(0);webPhotos().forEach(p=>{const bin=Math.min(23,Math.max(0,Math.floor((p.at-webPeriodStart)/(webPeriodEnd-webPeriodStart)*24)));counts[bin]++;});
 const max=Math.max(1,...counts),points=counts.map((n,i)=>[8+i*304/23,108-n/max*84]);let path=`M${points[0].join(' ')}`;
 for(let i=1;i<points.length;i++){const prev=points[i-1],now=points[i];path+=` Q${prev.join(' ')} ${(prev[0]+now[0])/2} ${(prev[1]+now[1])/2}`;}path+=` T${points.at(-1).join(' ')}`;
 return `<section class="time-panel web-time-panel"><p>시간대별 촬영 장수</p><svg class="time-chart" viewBox="0 0 320 120" role="img" aria-label="촬영 시간별 사진 수 그래프"><path d="M8 24H312M8 66H312M8 108H312" fill="none" stroke="#e1e4e9" stroke-dasharray="3 4"/><path d="${path} L312 108L8 108Z" fill="#e3e5e9"/><rect id="webTimeShade" x="${8+S.range[0]*304/24}" y="12" width="${(S.range[1]-S.range[0]+1)*304/24}" height="96" fill="#111" opacity=".12"/><path d="${path}" fill="none" stroke="#222" stroke-width="2.7"/></svg><div class="web-time-controls time-range-controls"><output id="webTimeTip" aria-live="polite">시작 ${webTimeText(S.range[0])}</output><div class="time-track"><i id="webTimeActiveTrack"></i></div><input type="range" min="0" max="23" value="${S.range[0]}" aria-label="사진 시간 범위 시작" oninput="updateWebTimeRange('start',this.value)"><input type="range" min="0" max="23" value="${S.range[1]}" aria-label="사진 시간 범위 종료" oninput="updateWebTimeRange('end',this.value)"></div><div class="time-axis"><span>${webTimeText(0)}</span><span>${webTimeText(23,true)}</span></div><div class="time-selected-label"><p class="web-time-label" id="webTimeLabel">${webTimeText(S.range[0])} – ${webTimeText(S.range[1],true)}</p><button class="web-time-reset" data-web-time-reset>전체 시간</button></div></section>`;
};
function appWebTimeGeometry(which='start'){const track=document.getElementById('webTimeActiveTrack'),tip=document.getElementById('webTimeTip');if(!track||!tip)return;track.style.cssText=`display:block;position:absolute;background:#444;height:4px;border-radius:3px;left:${S.range[0]/23*100}%;width:${(S.range[1]-S.range[0])/23*100}%`;const value=S.range[which==='end'?1:0],percent=value/23*100;tip.style.left=`clamp(58px,${percent}%,calc(100% - 58px))`;}
const appWebTimeUpdate=updateWebTimeRange;
updateWebTimeRange=function(which,value){S.webSelecting=false;S.webSelected.clear();appWebTimeUpdate(which,value);appWebTimeGeometry(which);};
const appWebFinalRender=render;
render=function(keep){appWebFinalRender(keep);scheduleWebViewportFit();if(S.screen==='album'&&S.tab==='browse'&&S.browseView==='time')appWebTimeGeometry();};

render();
</script>
